name: CI

on:
  push:
    branches: [main, omp-slim]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, omp-slim]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --experimental-strip-types

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js for compiler API checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # `dist` is a pure function of the sources and the lockfile, so key it on those rather than the
      # commit: a docs-only push then reuses the previous build instead of recompiling 12 packages.
      - name: Restore build output
        id: build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/*/dist
          key: dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/*/src/**', 'packages/*/tsconfig*.json', 'tsconfig*.json', 'scripts/build-*.mjs') }}

      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: bun run build

      - name: Pack preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/preview-packages.mjs pack --sha "$SHA" --out "$RUNNER_TEMP/preview-packages"

      - name: Upload preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-packages
          path: ${{ runner.temp }}/preview-packages
          retention-days: 3
          if-no-files-found: error

      # Same steps as `bun run check`, with two differences: the memo skips a step whose inputs are
      # byte-identical to a previous green run, and the type check is scoped to affected packages.
      # `--all` is not used here, so an unrecognized change (root config, workflow, script) falls back
      # to checking everything rather than nothing.
      - name: Check
        env:
          # Without a base the scope is the working tree, which is empty in CI. The workflow's own
          # diff is the real change set.
          IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: node scripts/run-check.mjs --base "$IMPACT_BASE"

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coding-agent
          - name: durable
          - name: other
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js for Node-specific tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install system dependencies
        if: matrix.name != 'durable'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # `dist` is a pure function of the sources and the lockfile, so key it on those rather than the
      # commit: a docs-only push then reuses the previous build instead of recompiling 12 packages.
      - name: Restore build output
        id: build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/*/dist
          key: dist-${{ runner.os }}-${{ hashFiles('bun.lock', 'packages/*/src/**', 'packages/*/tsconfig*.json', 'tsconfig*.json', 'scripts/build-*.mjs') }}

      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: bun run build

      - name: Build the pi-env daemon
        if: matrix.name == 'other'
        run: bun run --cwd packages/env build:daemon

      # Only the packages this change can reach. `scripts/impacted.mjs` walks the workspace
      # dependency graph, and treats any path it cannot attribute to a package as "run everything",
      # so a change to a root config or a shared script is never silently skipped.
      - name: Decide affected packages
        id: affected
        run: |
          JSON=$(node scripts/impacted.mjs --json --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}")
          echo "scope=$JSON" >> "$GITHUB_OUTPUT"
          echo "Affected: $JSON"

      - name: Test
        env:
          SUITE: ${{ matrix.name }}
          SCOPE: ${{ steps.affected.outputs.scope }}
        run: |
          AFFECTED=$(printf '%s' "$SCOPE" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log(j.everything?"all":j.packages.join(" "))})')
          echo "running for: $AFFECTED"

          # A test job with nothing in scope still reports success, so a docs-only change does not
          # hold a matrix leg for four minutes.
          skip_if_unchanged() {
            case " $AFFECTED " in
              *" all "*) return 1 ;;
              *" $1 "*) return 1 ;;
              *) echo "no changes affecting $1"; return 0 ;;
            esac
          }

          if [ "$SUITE" != other ]; then
            skip_if_unchanged "$SUITE" && exit 0
            bun run --cwd "packages/$SUITE" test
            exit 0
          fi

          skip_if_unchanged scripts && bun run test:scripts
          for dir in packages/*/; do
            name=$(basename "$dir")
            case "$name" in coding-agent|durable) continue ;; esac
            skip_if_unchanged "$name" && continue
            bun run --cwd "$dir" --if-present test
          done

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: MCP client conformance
        run: bun run test:mcp-conformance
